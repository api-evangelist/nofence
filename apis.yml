aid: nofence
name: Nofence
description: >-
  Nofence is a Norwegian agritech company (founded 2011, headquartered in
  Batnfjordsøra, Norway) that produces the world's first commercial virtual
  fencing system for livestock. Solar-powered GPS collars worn by cattle, sheep
  and goats keep animals inside virtual pastures that farmers draw on a map,
  with the collar teaching animals boundaries through audio cues before a mild
  electric pulse. The system is operated entirely from a mobile app (iOS and
  Android) and a web portal, communicating over GPS and the cellular network
  with no base stations or buried wire. Farmers get real-time animal location,
  boundary/escape push notifications, herd replay, grazing-history and
  multi-species management. Nofence is a consumer/farmer-facing product: as of
  this profile it publishes a mobile app and web portal but no public developer
  API, SDK, or API documentation surface. It is a portfolio company of
  Speedinvest, added to the API Evangelist network for tracking.
